alerts:
  - name: user_visible_high_latency
    severity: warning
    condition: latency_p95_ms > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#llmops-alerts"
    owner: llm-platform-oncall
    runbook: docs/alerts.md#alert-1
  - name: elevated_request_error_rate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#llmops-alerts"
    owner: api-oncall
    runbook: docs/alerts.md#alert-2
  - name: degraded_retrieval_success
    severity: warning
    condition: retrieval_success_rate_pct < 90
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: "#llmops-alerts"
    owner: rag-oncall
    runbook: docs/alerts.md#alert-3
